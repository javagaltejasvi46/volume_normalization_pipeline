[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "batch-audio-leveler"
version = "0.1.0"
description = "Batch MP4 Audio Loudness Normalizer using EBU R128 / ITU-R BS.1770"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Audio Engineering Team"}
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "textual>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
batch-audio-leveler = "batch_audio_leveler.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
